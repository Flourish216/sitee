<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jesse Zhang | Creative Lab</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">

  <!-- p5.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.0/lib/p5.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">

  <!-- Inline font setup -->
  <style>
    :root {
      --ui-font: "Manrope", Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      --display-font: "Space Grotesk", "Orbitron", Inter, system-ui, -apple-system;
    }
    body {
      font-family: var(--ui-font);
      margin: 0;
      background-color: #000;
      color: white;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    h1, h2, h3, .brand {
      font-family: var(--display-font);
      letter-spacing: -0.01em;
      font-weight: 700;
    }
    .muted { opacity: 0.85; font-weight: 400; }
    .accent { font-weight: 700; color: #00ffff; }
    .btn {
      display: inline-block;
      background: #00ffff;
      color: #000;
      padding: 0.7rem 1.3rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      margin: 0.5rem;
      transition: background 0.3s;
    }
    .btn:hover { background: #00cccc; }
    .btn.ghost {
      background: transparent;
      border: 2px solid #00ffff;
      color: #00ffff;
    }
    .btn.ghost:hover { background: #00ffff; color: #000; }
    header, footer {
      position: relative;
      z-index: 2;
    }
    main {
      position: relative;
      z-index: 2;
      text-align: center;
      padding-top: 20vh;
    }
    .hero h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    .lead { font-size: 1.1rem; max-width: 600px; margin: 0 auto 1.5rem; }
    nav a {
      margin: 0 10px;
      color: #00ffff;
      text-decoration: none;
      font-weight: 500;
    }
    nav a:hover { text-decoration: underline; }
    footer {
      text-align: center;
      padding: 2rem 0;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Jesse Zhang <span class="muted">
      <nav class="nav">
        <a href="projects.html">Projects</a>
        <a href="shop.html">Shop</a>
        <a href="links.html">Links</a>
      </nav>
    </div>
  </header>

  <main class="home">
    <div class="hero container">
      <h1>Welcome to my <span class="accent">Creative Lab</span></h1>
      <p class="lead">I design playful experiences — p5.js sketches, interactive systems, and creative products.</p>
      <div class="cta-row">
        <a class="btn" href="projects.html">See Projects</a>
        <a class="btn ghost" href="shop.html">Shop (mousepads)</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>Built by Jesse Zhang — <a href="links.html">Find me</a></small>
    </div>
  </footer>

  <script src="sketch.js"></script>
</body>
</html>
